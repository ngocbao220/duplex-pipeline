[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-pipelines"
version = "0.1.0"
description = "Three isolated two-speaker separation pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Shared orchestration and benchmark primitives only. Each pipeline owns
    # its incompatible Torch/NeMo runtime in pipeline/*/pyproject.toml.
    "hydra-core",
    "numpy",
    "omegaconf",
    "soundfile",
    "torch>=2.7.0,<=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]
cholimex = [
    "speechbrain==1.0.3",
]
duplexchat = [
    "speechbrain==1.0.3",
    "demucs==4.0.1",
]
diarization-pyannote = [
    "pyannote.audio==3.3.2",
]
diarization-sortformer = [
    "Cython==3.1.2",
    "packaging==24.2",
    "nemo_toolkit[asr]==2.7.3",
]
separation-dialoguesidon = [
    "diffusers==0.30.0",
    "huggingface-hub>=0.34.0,<1.0",
]
separation-sepformer = [
    "speechbrain==1.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scripts*"]

[tool.setuptools.package-dir]
"" = "."
cholimex = "pipeline/cholimex/src/cholimex"
duplexchat = "pipeline/duplexchat/src/duplexchat"
sommelier = "pipeline/sommelier/src/sommelier"

[tool.uv.extra-build-dependencies]
youtokentome = ["Cython"]
