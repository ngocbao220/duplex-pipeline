[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-pipelines"
version = "0.1.0"
description = "Three isolated two-speaker separation pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.67.0",
    "pyannote.audio==3.3.2",
    "torch>=2.7.0,<=2.8.0",
    "torchaudio>=2.7.0,<=2.8.0",
    "torchcodec>=0.6.0,<=0.7.0",
    "soundfile>=0.13.0,<=0.14.0",
    "diffusers<=0.30.0",
    "huggingface-hub==0.33.4",
    "wrapt>=2.4.0",
    "onnxruntime==1.22.1",
    "speechbrain==1.0.3",
    "librosa>=0.11.0,<=1.0.0",
    "pydub==0.25.1",
    "demucs>=4.0.1",
    "Cython==3.1.2",
    "nemo_toolkit[asr]>=2.3.0,<=3.0.0",
    "packaging==24.2",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "pytorch-lightning>=2.4.0,<=2.5.0.post0",
    "transformers>=4.51.0,<=4.53.3",
    "youtokentome>=1.0.6",
    "editdistance>=0.8.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]
cholimex = [
    "speechbrain==1.0.3",
]
duplexchat = [
    "speechbrain==1.0.3",
    "demucs==4.0.1",
]
diarization-pyannote = [
    "pyannote.audio==3.3.2",
]
diarization-sortformer = [
    "Cython==3.1.2",
    "packaging==24.2",
    "nemo_toolkit[asr]==2.3.0",
]
separation-dialoguesidon = [
    "diffusers==0.30.0",
    "huggingface-hub==0.33.4",
]
separation-sepformer = [
    "speechbrain==1.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scripts*"]

[tool.setuptools.package-dir]
"" = "."
cholimex = "pipeline/cholimex/src/cholimex"
duplexchat = "pipeline/duplexchat/src/duplexchat"
sommelier = "pipeline/sommelier/src/sommelier"
