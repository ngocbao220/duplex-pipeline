[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-pipelines"
version = "0.1.0"
description = "Three isolated two-speaker separation pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm",
    "pyannote.audio",
    "torch",
    "torchaudio",
    "torchcodec",
    "soundfile",
    "diffusers<=0.30.0",
    "huggingface-hub",
    "wrapt>=2.4.0",
    "onnxruntime",
    "speechbrain>=1.0,<2.0",
    "librosa>=0.10",
    "demucs",
    "Cython",
    "nemo_toolkit[asr]",
    "packaging",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
cholimex = [
    "speechbrain>=1.0,<2.0",
]
duplexchat = [
    "speechbrain>=1.0,<2.0",
    "demucs",
]
diarization-pyannote = [
    "pyannote.audio>=3.1",
]
diarization-sortformer = [
    "Cython",
    "packaging",
    "nemo_toolkit[asr]",
]
separation-dialoguesidon = [
    "diffusers",
    "huggingface_hub",
]
separation-sepformer = [
    "speechbrain>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scripts*"]

[tool.setuptools.package-dir]
"" = "."
cholimex = "pipeline/cholimex/src/cholimex"
duplexchat = "pipeline/duplexchat/src/duplexchat"
sommelier = "pipeline/sommelier/src/sommelier"
