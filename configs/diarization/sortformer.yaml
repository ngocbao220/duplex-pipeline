# @package diarization
backend: sortformer
model: ${env.paths.sortformer}
chunk_duration: null
num_speakers: 2
speaker_link_threshold: 0.75
min_duration_seconds: 0.25
max_chunk_seconds: full # Duration in seconds, or 'full' to process entire audio without chunking
min_silence_seconds: 0.3
nemo_log_level: ERROR

