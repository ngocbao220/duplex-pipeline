# @package _global_
defaults:
  - env: sever
  - dialogue_split: default
  - pipeline: duplexchat
  - diarization: sortformer
  - separation: dialoguesidon
  - benchmark: default
  - _self_

# Execution controls
step: all               # Options: all | convert | split_dialogue | separate_dialogue | sommelier | cholimex | benchmark | topic_map
gpu: 0                # Target GPU ID: auto (detects all available GPUs) | "0,1" | 0 | 1
debug: false            # Write intermediate debug audio/artifacts
dry_run: false          # Print execution commands without running

# Dataset & Directory Paths
data:
  source: youtube       # Sub-corpus name (e.g. youtube, podcast_index)
  crawl_dir: ${env.paths.base_data}/crawl
  raw_dir: ${env.paths.base_data}/raw/${data.source}
  dialogue_dir: ${env.paths.base_output}/dialogue/${data.source}
  duplex_out_dir: ${env.paths.base_output}/duplexchat/${data.source}
  sommelier_out_dir: ${env.paths.base_output}/sommelier/${data.source}
  cholimex_out_dir: ${env.paths.base_output}/cholimex/${data.source}
  pattern: "*.wav"

# Shared Runtime Settings
runtime:
  device: auto
  allow_cpu_fallback: true

# Transcript topic map
topic_map:
  input_dir: transcripts
  model_dir: ${env.paths.vietnamese_bi_encoder}
  output_dir: ${env.paths.base_output}/topic-map
  device: ${runtime.device}

# Concurrency & Performance Optimization (Tuned for GPU A100 40GB)
optimization:
  resource_mode: auto      # auto calibrates GPU file concurrency from observed peak VRAM; manual uses workers
  workers: 2               # Manual fallback workers per GPU
  max_workers_per_gpu: 8   # Hard upper bound for auto-tuned file concurrency
  gpu_memory_reserve_ratio: 0.10  # Conservative VRAM reserve during auto-tune
  convert_workers: auto    # Use all logical CPU cores for one-thread ffmpeg conversion
  threads_per_worker: 1    # Enforce strictly 1 CPU thread per worker process (CPU <= 100%)
