# @package pipeline
name: cholimex

backchannel_max_duration: 1.0
min_vad_duration: 0.0
vad_onset: null
vad_offset: null
vad_padding_ms: 30
merge_gap: 0.0
min_reference_duration: 2.0
speaker_assignment_mode: relative_similarity
cosine_similarity_threshold: 0.5
overlap_padding: 0.1
proposal_backend: dialoguesidon
proposal_model: ${env.paths.dialoguesidon}
overlap_separator_backend: sepreformer
overlap_separator_model: ${env.paths.sepreformer}
speaker_embedding_model: ${env.paths.speechbrain}

# Reconstruction smoothing between original-mixture and DialogueSidon audio
crossfade_ms: 40.0
gate_fade_ms: 20.0
gain_match: true
gain_context_s: 1.0
gain_max: 2.0
