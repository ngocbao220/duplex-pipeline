# @package dialogue_split
name: default

diarization:
  backend: ${diarization.backend}
  model: ${diarization.model}

music_filter:
  enabled: true
  model: htdemucs

lid:
  enabled: true
  code: vi
  model: ${env.paths.whisper}
  min_prob: 0.5

dialogue:
  gap_seconds: 5.0
  min_duration_seconds: 10.0
  max_duration_seconds: 600.0
  max_single_speaker_ratio: 0.8
  preferred_split_pause_seconds: 3.0
  min_split_pause_seconds: 1.5
