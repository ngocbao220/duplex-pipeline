[project]
name = "cholimex-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duplex-pipelines[cholimex]",
    "soundfile",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "diffusers==0.30.0",
    "huggingface-hub==0.33.4",
    "wrapt",
    "speechbrain==1.0.3",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duplex-pipelines = { path = "../..", editable = true }

[tool.uv.extra-build-dependencies]
youtokentome = ["Cython"]
