[project]
name = "sommelier-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duplex-pipelines",
  "numpy==2.5.3",
  "soundfile==0.14.0",
  "pydub==0.25.1",
  "librosa==1.0.0",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "torchmetrics==1.7.4",
  "pyannote.audio==3.3.2",
  "speechbrain==1.0.3",
  "nemo_toolkit[asr]==3.0.0",
  "panns-inference==0.1.1",
  "loguru==0.7.3",
  "tqdm==4.70.1",
  "lightning==2.4.0",
  "openai==1.97.1",
  "tritony==0.0.20",
  "pandas==2.3.1",
  "requests==2.32.4",
  "g2pk==0.9.4",
  "huggingface-hub==0.33.4",
  "onnxruntime==1.22.1",
  "faster-whisper==1.1.1",
  "whisperx==3.4.2",
  "asteroid-filterbanks==0.4.0",
  "pyloudnorm==0.1.1",
  "Cython==3.1.2",
  "packaging==24.2",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "transformers==4.53.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duplex-pipelines = { path = "../..", editable = true }
