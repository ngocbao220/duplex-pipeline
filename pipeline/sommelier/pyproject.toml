[project]
name = "sommelier-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duplex-pipelines",
  "numpy",
  "soundfile",
  "pydub",
  "librosa",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "torchmetrics==1.7.4",
  "pyannote.audio==3.3.2",
  "speechbrain==1.0.3",
  "nemo_toolkit[asr]==3.0.0",
  "panns-inference==0.1.1",
  "loguru",
  "tqdm",
  "lightning==2.4.0",
  "openai==1.97.1",
  "tritony==0.0.20",
  "pandas",
  "requests",
  "g2pk",
  "huggingface-hub==0.33.4",
  "onnxruntime==1.22.1",
  "faster-whisper==1.1.1",
  "whisperx==3.4.2",
  "asteroid-filterbanks",
  "pyloudnorm",
  "Cython",
  "packaging",
  "omegaconf",
  "hydra-core",
  "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duplex-pipelines = { path = "../..", editable = true }

[tool.uv.extra-build-dependencies]
youtokentome = ["Cython"]
