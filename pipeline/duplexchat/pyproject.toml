[project]
name = "duplexchat-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duplex-pipelines",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile==0.13.1",
    "pydub==0.25.1",
    "librosa==0.11.0",
    "demucs==4.0.1",
    "pyannote.audio==3.3.2",
    "speechbrain==1.0.3",
    "diffusers==0.30.0",
    "huggingface-hub==0.33.4",
    "wrapt==2.4.0",
    "onnxruntime==1.22.1",
    "numpy==1.26.4",
    "Cython==3.1.2",
    "packaging==24.2",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "pytorch-lightning==2.5.0.post0",
    "transformers==4.53.3",
    "youtokentome==1.0.6",
    "editdistance==0.8.1",
    "nemo_toolkit[asr]==2.3.0",
    "tqdm==4.67.1",
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duplex-pipelines = { path = "../..", editable = true }
