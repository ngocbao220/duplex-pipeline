[project]
name = "duplexchat-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duplex-pipelines",
    "torch",
    "torchaudio",
    "demucs",
    "speechbrain>=1.0,<2.0",
    "pyannote.audio>=3.1",
    "diffusers<=0.30.0",
    "huggingface-hub",
    "soundfile",
    "wrapt>=2.4.0",
    "Cython",
    "nemo_toolkit[asr]"
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duplex-pipelines = { path = "../..", editable = true }
